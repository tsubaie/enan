services:
  app:
    # ADMIN-B54: the published image (`latest` is the newest release, `edge` the newest main that
    # passed every check, or pin a version such as `0.2`). `docker compose up -d --build` still
    # builds it from this checkout instead.
    image: ghcr.io/tsubaie/enan:${ENAN_TAG:-latest}
    build:
      context: .
      target: runtime
    env_file: .env
    environment:
      DATABASE_URL: file:/var/lib/enan/data/enan.db
      FILES_DIR: /var/lib/enan/files
      BACKUP_DIR: /var/lib/enan/backups
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - data:/var/lib/enan/data
      - files:/var/lib/enan/files
      - backups:/var/lib/enan/backups
      # ADMIN-B57, ADR 0051: the updater's status, read-only, and where Admin → Updates leaves
      # its requests. Both stay empty while the updater is off.
      - updater-status:/var/lib/enan-updater/status:ro
      - updater-commands:/var/lib/enan-updater/commands
    restart: unless-stopped
    stop_grace_period: 35s
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/health').then(async r=>{const h=await r.json();process.exit(r.ok&&h.db?0:1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
  # ADMIN-B56, ADMIN-B67, ADR 0057: announces new releases of `app`'s channel on Admin → Updates
  # and installs one when an administrator asks, or allows it there. Runs on every install; set
  # ENAN_UPDATER_REPLICAS=0 to go without it (README § Automatic updates). The Docker socket is given to this
  # service only, never to the app.
  updater:
    # ADR 0060: the updater comes from the app's channel, so it cannot fall behind the app.
    image: ghcr.io/tsubaie/enan-updater:${ENAN_UPDATER_TAG:-${ENAN_CHANNEL:-${ENAN_TAG:-latest}}}
    deploy:
      replicas: ${ENAN_UPDATER_REPLICAS:-1}
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - updater-status:/var/lib/enan-updater/status
      - updater-commands:/var/lib/enan-updater/commands
    environment:
      ENAN_CHANNEL: ${ENAN_CHANNEL:-}
      ENAN_UPDATE_INTERVAL: ${ENAN_UPDATE_INTERVAL:-24h}
      # Read once, by an install from before ADR 0057; the window is set on Admin → Updates now.
      ENAN_UPDATE_WINDOW: ${ENAN_UPDATE_WINDOW:-}
      ENAN_UPDATE_TZ: ${ENAN_UPDATE_TZ:-UTC}
      ENAN_ALERT_WEBHOOK: ${ENAN_ALERT_WEBHOOK:-}
volumes:
  data:
  files:
  backups:
  updater-status:
  updater-commands:
