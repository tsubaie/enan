services:
  app:
    build:
      context: .
      target: runtime
    env_file: .env
    environment:
      DATABASE_URL: file:/var/lib/executiveos/data/executiveos.db
      FILES_DIR: /var/lib/executiveos/files
      BACKUP_DIR: /var/lib/executiveos/backups
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - data:/var/lib/executiveos/data
      - files:/var/lib/executiveos/files
      - backups:/var/lib/executiveos/backups
    restart: unless-stopped
    stop_grace_period: 35s
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/health').then(async r=>{const h=await r.json();process.exit(r.ok&&h.db?0:1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
volumes:
  data:
  files:
  backups:
