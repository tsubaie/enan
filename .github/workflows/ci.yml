name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  # A newer push cancels checks on other branches, never a run on main: a run cut short there could
  # leave `edge` behind the commit it already published. On main the next run waits for this one.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# `pnpm audit:all` is `audit:static && audit:data && audit:browser`, so the jobs below cover
# exactly what a developer runs locally, split by what each group actually needs: nothing, the
# unit and integration suites, or a browser and a production build (one job per Playwright
# project). They run in parallel, so the wall clock is the slowest group rather than the sum. The database is a SQLite
# file under tmp/ (ADR 0029), so no job needs a service container.
#
# Every job runs on GitHub's hosted runners (`ubuntu-latest`, x86-64). The browser jobs restore
# Next's build cache and the image job Docker's layer cache from GitHub's cache service, so a run
# rebuilds only what changed. To run elsewhere, set the repository variable CI_RUNS_ON (JSON,
# quotes included), for example ["self-hosted", "linux", "x64"]. Never point a public
# repository's pull requests at a self-hosted runner you also use for anything else: a pull
# request from a fork runs its own code there. See docs/08-testing-strategy.md § CI.
env:
  DATABASE_URL: file:${{ github.workspace }}/tmp/enan_test.db
  DATABASE_URL_TEST: file:${{ github.workspace }}/tmp/enan_test.db
  SESSION_SECRET: ci-only-session-secret-0123456789abcdefghij
  # ADMIN-B22: the recovery suite needs a configured token, and it must clear the entropy floor.
  RECOVERY_TOKEN: ci-only-recovery-token-0123456789abcdefghij
  APP_URL: http://localhost:3000
  FILES_DIR: ${{ github.workspace }}/tmp/files
  BACKUP_DIR: ${{ github.workspace }}/tmp/backups
  NEXT_TELEMETRY_DISABLED: '1'
  # Next builds use this many workers instead of one per core (next.config.ts); a hosted runner
  # has four cores.
  NEXT_BUILD_CPUS: '4'

jobs:
  # Which kinds of files changed. The container image is rebuilt on a pull request only when the
  # files that shape it changed; a push to main always builds it (the gate below knows the rule).
  changes:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    permissions:
      contents: read
      pull-requests: read
    outputs:
      image: ${{ steps.filter.outputs.image }}
      updater: ${{ steps.filter.outputs.updater }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            image:
              - 'Dockerfile'
              - '.dockerignore'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'docker-compose*.yml'
              - 'next.config.ts'
              - 'scripts/build/**'
              - 'scripts/db/migrate.ts'
              - 'scripts/backup/**'
              - 'src/core/backup/**'
              - 'src/core/db/**'
              - 'drizzle/**'
              - '.github/workflows/ci.yml'
            updater:
              - 'updater/**'
              - '.github/workflows/ci.yml'

  static:
    name: Static checks
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 15
    steps:
      # audit:docs reads ADR history, audit:secrets scans every commit, and audit:dupes diffs
      # against main, so this job is the one that needs the full history.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      # The build for the runner's architecture.
      - name: Install gitleaks
        run: |
          case "$RUNNER_ARCH" in ARM64) arch=arm64 ;; *) arch=x64 ;; esac
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_$arch.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - run: pnpm audit:static

  # `pnpm audit:data` on one runner: Vitest runs the test files in parallel, each worker on its
  # own SQLite file (tests/setup/worker-database.ts), so the runner's cores divide the wall clock.
  test:
    name: Unit and integration
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm audit:data

  # The suite is split across runners, each in its own container: the desktop project in six
  # Playwright shards and the mobile project in five. Each job builds once (from the restored Next
  # cache) and runs its shard on two lanes (e2e/lanes.ts). The audits that follow the suite run in
  # their own job (browser-audits below), so no shard carries them.
  browser:
    name: Browser (${{ matrix.project }} ${{ matrix.shard }}/${{ matrix.of }})
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: desktop, shard: 1, of: 6 }
          - { project: desktop, shard: 2, of: 6 }
          - { project: desktop, shard: 3, of: 6 }
          - { project: desktop, shard: 4, of: 6 }
          - { project: desktop, shard: 5, of: 6 }
          - { project: desktop, shard: 6, of: 6 }
          - { project: mobile, shard: 1, of: 5 }
          - { project: mobile, shard: 2, of: 5 }
          - { project: mobile, shard: 3, of: 5 }
          - { project: mobile, shard: 4, of: 5 }
          - { project: mobile, shard: 5, of: 5 }
    # Chromium and its system packages are preinstalled in the image. The tag must equal the
    # lockfile's @playwright/test version (checked below).
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --init --ipc=host
    steps:
      - uses: actions/checkout@v4
      # Inside a container job `${{ github.workspace }}` (used by the workflow-level env above) is
      # the host's path; the checkout is mounted at $GITHUB_WORKSPACE. Point the data paths there.
      - name: Use the container's workspace for the data paths
        run: |
          {
            echo "DATABASE_URL=file:$GITHUB_WORKSPACE/tmp/enan_test.db"
            echo "DATABASE_URL_TEST=file:$GITHUB_WORKSPACE/tmp/enan_test.db"
            echo "FILES_DIR=$GITHUB_WORKSPACE/tmp/files"
            echo "BACKUP_DIR=$GITHUB_WORKSPACE/tmp/backups"
          } >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup
      - name: Check the Playwright image matches the lockfile
        run: |
          installed=$(node -p "require('@playwright/test/package.json').version")
          test "$installed" = "1.63.0" || { echo "::error::@playwright/test is $installed but the container image is v1.63.0 — update both in .github/workflows/ci.yml"; exit 1; }
      # A hosted runner starts empty: restore Next's incremental build cache.
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'next.config.ts', 'tsconfig.json') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Build
        run: pnpm build
      - name: Browser tests (${{ matrix.project }} ${{ matrix.shard }}/${{ matrix.of }})
        run: pnpm test:e2e --project ${{ matrix.project }} --shard ${{ matrix.shard }}/${{ matrix.of }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}-${{ matrix.shard }}
          path: playwright-report
          retention-days: 7

  # The audits that follow the suite in `pnpm audit:browser` (bundle, OpenAPI, accessibility,
  # performance), on their own runner. The accessibility audit signs in as lane 0's browser-test
  # administrator, which Playwright's global setup provisions, so one short spec runs first to do
  # that (the security headers spec, which also proves the build serves pages).
  browser-audits:
    name: Browser audits
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 30
    # Chromium and its system packages are preinstalled in the image. The tag must equal the
    # lockfile's @playwright/test version (checked below).
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --init --ipc=host
    steps:
      - uses: actions/checkout@v4
      # Inside a container job `${{ github.workspace }}` (used by the workflow-level env above) is
      # the host's path; the checkout is mounted at $GITHUB_WORKSPACE. Point the data paths there.
      - name: Use the container's workspace for the data paths
        run: |
          {
            echo "DATABASE_URL=file:$GITHUB_WORKSPACE/tmp/enan_test.db"
            echo "DATABASE_URL_TEST=file:$GITHUB_WORKSPACE/tmp/enan_test.db"
            echo "FILES_DIR=$GITHUB_WORKSPACE/tmp/files"
            echo "BACKUP_DIR=$GITHUB_WORKSPACE/tmp/backups"
          } >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup
      - name: Check the Playwright image matches the lockfile
        run: |
          installed=$(node -p "require('@playwright/test/package.json').version")
          test "$installed" = "1.63.0" || { echo "::error::@playwright/test is $installed but the container image is v1.63.0 — update both in .github/workflows/ci.yml"; exit 1; }
      # A hosted runner starts empty: restore Next's incremental build cache.
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'next.config.ts', 'tsconfig.json') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Build
        run: pnpm build
      - name: Bundle audit
        run: pnpm audit:bundle
      - name: Provision the browser-test administrator
        run: pnpm test:e2e e2e/security.spec.ts --project desktop
        env:
          E2E_WORKERS: '1'
      - name: OpenAPI audit
        run: pnpm audit:openapi
      - name: Accessibility audit
        run: pnpm audit:a11y
      - name: Performance audit
        run: pnpm audit:perf
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-audits
          path: playwright-report
          retention-days: 7

  # The container image, one job for both purposes. On a pull request it proves the Dockerfile
  # still builds (kept local, never published). On a push to main it builds the production image
  # (linux/amd64), publishes it to GHCR tagged with the commit only, and smoke-tests it (a fresh
  # SQLite volume, migrations on start, a healthy /api/v1/health naming this commit). Channel tags
  # move later, once the gate has passed (publish, below, and release.yml; ADR 0050). Both reuse
  # Docker's layer cache from GitHub's cache service; only main writes it.
  docker:
    name: Container image
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.image == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # ADMIN-B54, ADMIN-B55: what the image says about itself. schema-labels.ts has no
      # dependencies, so Node alone runs it, without installing the workspace.
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Image identity
        id: identity
        run: |
          node scripts/build/schema-labels.ts >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
      - name: Build the image (pull request)
        if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          build-args: |
            NEXT_BUILD_CPUS=${{ env.NEXT_BUILD_CPUS }}
            ENAN_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.identity.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.enan.schema=${{ steps.identity.outputs.schema }}
            org.enan.contract=${{ steps.identity.outputs.contract }}
          cache-from: type=gha,scope=runtime
          push: false
          # Loaded into the runner's Docker so the smoke test below runs it too.
          load: true
          tags: enan-ci:pr
      - if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          build-args: |
            NEXT_BUILD_CPUS=${{ env.NEXT_BUILD_CPUS }}
            ENAN_REVISION=${{ github.sha }}
          # Only the commit. An image that fails a check below must never become `edge` or `latest`.
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          # `source` links the package to this repository, which makes it public with it (ADR 0051).
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.identity.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.enan.schema=${{ steps.identity.outputs.schema }}
            org.enan.contract=${{ steps.identity.outputs.contract }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,scope=runtime,mode=max
          push: true
          # No attestation manifests: they show up as untagged package versions.
          provenance: false
      # The image serves, migrates on start, and runs the commands the container is used for
      # (README § Backups): db:migrate, backup:create, backup:restore.
      - name: Smoke-test the production image
        env:
          IMAGE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('ghcr.io/{0}:{1}', github.repository, github.sha) || 'enan-ci:pr' }}
        run: |
          set -eu
          name=ci-exos-smoke-run${{ github.run_number }}-${{ github.run_attempt }}
          cleanup() {
            docker rm -f "$name" >/dev/null 2>&1 || true
            for v in data files backups; do docker volume rm -f "$name-$v" >/dev/null 2>&1 || true; done
          }
          trap cleanup EXIT
          for v in data files backups; do docker volume create "$name-$v" >/dev/null; done
          docker run -d --name "$name" --platform linux/amd64 -p 127.0.0.1::3000 \
            -v "$name-data:/var/lib/enan/data" \
            -v "$name-files:/var/lib/enan/files" \
            -v "$name-backups:/var/lib/enan/backups" \
            -e DATABASE_URL=file:/var/lib/enan/data/enan.db \
            -e FILES_DIR=/var/lib/enan/files -e BACKUP_DIR=/var/lib/enan/backups \
            -e SESSION_SECRET=ci-smoke-only-session-secret-0123456789abcdef \
            -e APP_URL=http://localhost:3000 -e JOBS_ENABLED=false "$IMAGE"
          port=$(docker port "$name" 3000/tcp | head -n 1 | sed 's/.*://')
          healthy() {
            for attempt in $(seq 1 60); do
              body=$(curl -sf "http://127.0.0.1:$port/api/v1/health" || true)
              case "$body" in *'"db":true'*) echo "healthy: $body"; return 0;; esac
              sleep 3
            done
            docker logs "$name" | tail -50
            echo "::error::the production image did not become healthy"
            return 1
          }
          healthy
          # ADMIN-B54: health names the commit the image was built from.
          curl -sf "http://127.0.0.1:$port/api/v1/health" | grep -q '"revision":"${{ github.sha }}"' \
            || { echo "::error::/api/v1/health does not report revision ${{ github.sha }}"; exit 1; }
          docker exec "$name" pnpm db:migrate
          docker exec "$name" pnpm backup:create
          backup=$(docker exec "$name" ls /var/lib/enan/backups | head -n 1)
          test -n "$backup" || { echo "::error::backup:create wrote no backup"; exit 1; }
          docker exec "$name" pnpm backup:restore "/var/lib/enan/backups/$backup" --confirm
          healthy
          docker image inspect "$IMAGE" --format 'image size: {{.Size}} bytes'
      # ADMIN-B55, ADR 0050: an updater rolls back by starting the previous image on the database
      # this one migrated, so that must work unless this image's migrations say it cannot
      # (`-- enan:contract`). The previous image is the newest main that passed every check.
      - name: The previous image runs on this image's database
        env:
          IMAGE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('ghcr.io/{0}:{1}', github.repository, github.sha) || 'enan-ci:pr' }}
          PREVIOUS: ghcr.io/${{ github.repository }}:edge
          CONTRACT: ${{ steps.identity.outputs.contract }}
        run: |
          set -eu
          if ! docker pull -q "$PREVIOUS" >/dev/null 2>&1; then
            echo "::notice::$PREVIOUS does not exist yet; nothing to roll back to"
            exit 0
          fi
          schema=$(docker image inspect "$PREVIOUS" --format '{{ index .Config.Labels "org.enan.schema" }}')
          case "$schema" in '' | '<no value>') schema=0 ;; esac
          if [ "$CONTRACT" -gt "$schema" ]; then
            echo "::notice::migration $CONTRACT is marked enan:contract and $PREVIOUS stops at $schema; a rollback across it is not supported"
            exit 0
          fi
          name=ci-exos-rollback-run${{ github.run_number }}-${{ github.run_attempt }}
          cleanup() {
            docker rm -f "$name" >/dev/null 2>&1 || true
            docker volume rm -f "$name-data" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker volume create "$name-data" >/dev/null
          start() {
            docker rm -f "$name" >/dev/null 2>&1 || true
            docker run -d --name "$name" --platform linux/amd64 -p 127.0.0.1::3000 \
              -v "$name-data:/var/lib/enan/data" \
              -e DATABASE_URL=file:/var/lib/enan/data/enan.db \
              -e SESSION_SECRET=ci-smoke-only-session-secret-0123456789abcdef \
              -e APP_URL=http://localhost:3000 -e JOBS_ENABLED=false "$1" >/dev/null
            port=$(docker port "$name" 3000/tcp | head -n 1 | sed 's/.*://')
            for attempt in $(seq 1 60); do
              body=$(curl -sf "http://127.0.0.1:$port/api/v1/health" || true)
              case "$body" in *'"db":true'*) echo "$1 healthy: $body"; return 0;; esac
              sleep 3
            done
            docker logs "$name" | tail -50
            echo "::error::$1 did not become healthy on a database migrated by $IMAGE"
            return 1
          }
          start "$IMAGE"
          start "$PREVIOUS"

  # ADMIN-B56, ADR 0051: the updater, a Go service with its own image. Its integration test runs
  # the update cycle against this runner's Docker with a local registry. On a push to main the
  # image is published as `-updater:<sha>`; it moves to `edge` with the app's (publish, below).
  updater:
    name: Updater
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.updater == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: updater
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.x
          cache-dependency-path: updater/go.mod
      - name: Format, vet and known vulnerabilities
        run: |
          unformatted=$(gofmt -l .)
          [ -z "$unformatted" ] || { echo "::error::not gofmt-formatted: $unformatted"; exit 1; }
          go vet ./...
          go vet -tags integration ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: go test -race ./...
      - name: The update cycle against Docker
        run: go test -tags integration -run Integration -count=1 -v ./internal/updater
      - uses: docker/setup-buildx-action@v3
      - if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: updater
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}-updater:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=updater
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'type=gha,scope=updater,mode=max' || '' }}
          provenance: false

  # One status to require on the branch: it fails if any group above failed or was skipped. The
  # image and the updater may be skipped only on a pull request whose changes do not touch them.
  gate:
    name: Gate
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    needs: [changes, static, test, browser, browser-audits, docker, updater]
    if: always()
    steps:
      - name: Check the groups
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          IMAGE_CHANGED: ${{ needs.changes.outputs.image }}
          STATIC_RESULT: ${{ needs.static.result }}
          TEST_RESULT: ${{ needs.test.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          AUDITS_RESULT: ${{ needs.browser-audits.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          UPDATER_CHANGED: ${{ needs.changes.outputs.updater }}
          UPDATER_RESULT: ${{ needs.updater.result }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "changes=$CHANGES_RESULT image-changed=$IMAGE_CHANGED static=$STATIC_RESULT test=$TEST_RESULT"
          echo "browser=$BROWSER_RESULT audits=$AUDITS_RESULT docker=$DOCKER_RESULT updater=$UPDATER_RESULT event=$EVENT"
          test "$CHANGES_RESULT" = success
          test "$STATIC_RESULT" = success
          test "$TEST_RESULT" = success
          test "$BROWSER_RESULT" = success
          test "$AUDITS_RESULT" = success
          if [ "$EVENT" = push ] || [ "$IMAGE_CHANGED" = true ]; then
            test "$DOCKER_RESULT" = success
          else
            test "$DOCKER_RESULT" = skipped
          fi
          if [ "$EVENT" = push ] || [ "$UPDATER_CHANGED" = true ]; then
            test "$UPDATER_RESULT" = success
          else
            test "$UPDATER_RESULT" = skipped
          fi

  # ADMIN-B54, ADR 0050: the `edge` channel follows main, but only to an image that passed every
  # check: the gate, so the smoke test and the rollback check above included. Releases move the
  # version tags and `latest` (release.yml).
  publish:
    name: Publish edge
    needs: [gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Move edge to this commit
        run: |
          image=ghcr.io/${{ github.repository }}
          docker buildx imagetools create --tag "$image:edge" "$image:${{ github.sha }}"
          docker buildx imagetools create --tag "$image-updater:edge" "$image-updater:${{ github.sha }}"
