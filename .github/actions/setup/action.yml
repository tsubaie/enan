name: Setup
description: pnpm, Node and installed dependencies, shared by every CI job.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 10.30.3
    - uses: actions/setup-node@v4
      with:
        node-version: 26.13.0
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
